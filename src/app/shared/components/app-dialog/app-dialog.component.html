@if (open()) {
  <div class="dialog__backdrop" (click)="onBackdropClick($event)" (keydown)="onKeydown($event)">
    <div
      #panel
      class="dialog__panel"
      [class]="'dialog__panel--' + size()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
      tabindex="-1"
    >
      <header class="dialog__header">
        <div class="dialog__titles">
          <h2 class="text-h2">{{ title() }}</h2>
          @if (description(); as value) {
            <p class="text-sm text-muted">{{ value }}</p>
          }
        </div>

        @if (showClose()) {
          <app-button variant="ghost" size="sm" icon="x" ariaLabel="Kapat" (pressed)="close()" />
        }
      </header>

      <div class="dialog__body"><ng-content /></div>

      <footer class="dialog__footer"><ng-content select="[dialog-footer]" /></footer>
    </div>
  </div>
}
