@if (isLoading()) {
  <div class="header__progress" role="status" aria-label="İstek sürüyor"></div>
}

<div class="header__start">
  <app-button
    class="header__menu-toggle"
    variant="ghost"
    size="sm"
    icon="menu"
    ariaLabel="Menüyü aç"
    (pressed)="ui.toggleSidebar()"
  />
  <app-breadcrumb [items]="breadcrumb()" />
</div>

<div class="header__search-wrap">
  <form class="header__search" role="search" (submit)="onSearchSubmit($event)">
    <app-icon name="search" [size]="15" />
    <input
      type="search"
      class="header__search-input"
      placeholder="Kullanıcı, ders, sınav veya soru ara…"
      aria-label="Genel arama"
      [attr.aria-expanded]="isSearchOpen()"
      [value]="search()"
      (input)="onSearchInput($event)"
      (focus)="onSearchFocus()"
    />
  </form>

  @if (isSearchOpen()) {
    <div
      class="header__search-panel"
      [style.top.px]="searchPlacement()?.top"
      [style.left.px]="searchPlacement()?.left"
      [style.width.px]="searchPanelWidth()"
      [style.max-height.px]="searchPlacement()?.maxHeight"
    >
      <app-global-search-panel
        [result]="searchResult()"
        [loading]="isSearching()"
        [term]="search()"
        (navigate)="onSearchNavigate()"
      />
    </div>
  }
</div>

<div class="header__end">
  @if (isOffline()) {
    <app-status-badge label="Çevrimdışı" tone="danger" icon="wifi-off" />
  }

  @if (auth.canSwitchRole()) {
    <app-dropdown
      [items]="roleItems()"
      triggerVariant="secondary"
      triggerSize="sm"
      [triggerIcon]="null"
      [triggerText]="auth.activeRoleLabel()"
      triggerLabel="Rol değiştir"
      (itemSelect)="onRoleSelect($event)"
    />
  } @else {
    <app-status-badge [label]="auth.activeRoleLabel()" tone="primary" icon="shield-check" />
  }

  <button
    type="button"
    class="header__theme"
    [attr.aria-label]="theme.isDark() ? 'Açık temaya geç' : 'Koyu temaya geç'"
    [attr.aria-pressed]="theme.isDark()"
    (click)="theme.toggle()"
  >
    <app-icon [name]="theme.isDark() ? 'sun' : 'moon'" [size]="17" />
  </button>

  <div class="header__notifications">
    <button
      type="button"
      class="header__bell"
      [attr.aria-expanded]="isPanelOpen()"
      aria-haspopup="dialog"
      [attr.aria-label]="
        notifications.unreadCount() > 0
          ? notifications.unreadCount() + ' okunmamış bildirim'
          : 'Bildirimler'
      "
      (click)="togglePanel()"
    >
      <app-icon name="bell" [size]="17" />
      @if (notifications.hasUnread()) {
        <span class="header__bell-badge tabular">{{ notifications.unreadCount() }}</span>
      }
    </button>

    @if (isPanelOpen()) {
      <div
        class="header__panel"
        role="dialog"
        aria-label="Bildirimler"
        [style.top.px]="notificationPlacement()?.top"
        [style.left.px]="notificationPlacement()?.left"
      >
        <header class="header__panel-head">
          <span class="text-body-strong">Bildirimler</span>
          @if (notifications.hasUnread()) {
            <button type="button" class="header__panel-action" (click)="onMarkAllRead()">
              Tümünü okundu işaretle
            </button>
          }
        </header>

        <div class="header__panel-body">
          <app-notification-list
            [notifications]="notifications.items()"
            (markRead)="onNotificationRead($event)"
          />
        </div>
      </div>
    }
  </div>

  @if (user(); as currentUser) {
    <div class="header__user">
      <app-avatar [name]="currentUser.fullName" size="md" />
      <div class="header__user-text">
        <span class="text-sm text-body-strong truncate">{{ currentUser.fullName }}</span>
        <span class="text-xs text-subtle truncate">{{ currentUser.title }}</span>
      </div>
      <app-dropdown
        [items]="userItems()"
        triggerIcon="chevron-down"
        triggerLabel="Kullanıcı menüsü"
        (itemSelect)="onUserAction($event)"
      />
    </div>
  }
</div>
