<div class="page">
  <header class="page-header">
    <div>
      <h1 class="text-h1">Dersler</h1>
      <p class="text-sm text-muted">
        Ders katalogunu yönetin; eğitmen, kategori, seviye ve yayın durumunu izleyin.
      </p>
    </div>

    @if (canCreate()) {
      <app-button variant="primary" icon="plus" (pressed)="openForm(null)">Yeni ders</app-button>
    }
  </header>

  <app-filter-bar
    [query]="facade.query()"
    [filters]="filters()"
    searchPlaceholder="Ders kodu, adı veya eğitmen adında ara…"
    (searchChange)="facade.setSearch($event)"
    (filterChange)="facade.setFilter($event.key, $event.value)"
    (clearAll)="facade.clearFilters()"
  />

  <app-table
    [columns]="columns()"
    [rows]="facade.items()"
    [query]="facade.query()"
    [total]="facade.total()"
    [status]="facade.status()"
    [error]="facade.error()"
    [filtered]="facade.isFiltered()"
    [rowClickable]="true"
    [mutatingIds]="facade.mutatingIds()"
    emptyTitle="Ders bulunamadı"
    emptyDescription="Bu kapsamda görüntülenecek ders yok."
    (sortChange)="facade.toggleSort($event)"
    (pageChange)="facade.goToPage($event)"
    (sizeChange)="facade.setPageSize($event)"
    (rowClick)="openDetail($event)"
    (retry)="facade.load()"
    (clearFilters)="facade.clearFilters()"
  />
</div>

<ng-template #nameCell let-course>
  <div class="cell-name">
    <span class="text-body-strong truncate">{{ course.name }}</span>
    @if (course.description) {
      <span class="text-xs text-subtle truncate">{{ course.description }}</span>
    }
  </div>
</ng-template>

<ng-template #metaCell let-course>
  <div class="cell-meta">
    <span class="text-sm">{{ categoryLabel(course.category) }}</span>
    <span class="text-xs text-subtle">{{ levelLabel(course.level) }}</span>
  </div>
</ng-template>

<ng-template #stateCell let-course>
  <app-status-badge
    [label]="toneFor(course.state).label"
    [tone]="toneFor(course.state).tone"
    [icon]="toneFor(course.state).icon"
  />
</ng-template>

<ng-template #actionsCell let-course>
  <app-dropdown
    [items]="rowActions(course)"
    triggerLabel="Ders işlemleri"
    (itemSelect)="onRowAction(course, $event)"
  />
</ng-template>

@if (isFormOpen()) {
  <app-course-form
    #form
    [course]="editing()"
    [programs]="programOptions()"
    [terms]="termOptions()"
    [instructors]="instructorOptions()"
    [saving]="facade.isSaving()"
    (save)="onSave($event, form)"
    (cancel)="closeForm()"
  />
}
