<div class="page">
  <header class="page-header">
    <div>
      <h1 class="text-h1">Ölçme planları</h1>
      <p class="text-sm text-muted">
        Blueprint, sınavın kazanım × zorluk dağılımını belirler. Ders geneli planların yanında
        gruba özel planlar da burada listelenir.
      </p>
    </div>

    @if (canWrite()) {
      <app-button variant="primary" icon="plus" (pressed)="createBlueprint()">
        Yeni plan
      </app-button>
    }
  </header>

  <app-filter-bar
    [query]="facade.query()"
    [filters]="filters()"
    searchPlaceholder="Plan adı veya açıklamasında ara…"
    (searchChange)="facade.setSearch($event)"
    (filterChange)="facade.setFilter($event.key, $event.value)"
    (clearAll)="facade.clearFilters()"
  />

  <app-table
    [columns]="columns()"
    [rows]="facade.items()"
    [query]="facade.query()"
    [total]="facade.total()"
    [status]="facade.status()"
    [error]="facade.error()"
    [filtered]="facade.isFiltered()"
    [rowClickable]="true"
    [mutatingIds]="facade.mutatingIds()"
    emptyTitle="Plan bulunamadı"
    emptyDescription="Bu kapsamda görüntülenecek ölçme planı yok."
    (sortChange)="facade.toggleSort($event)"
    (pageChange)="facade.goToPage($event)"
    (sizeChange)="facade.setPageSize($event)"
    (rowClick)="openDetail($event)"
    (retry)="facade.load()"
    (clearFilters)="facade.clearFilters()"
  />
</div>

<ng-template #nameCell let-blueprint>
  <div class="cell-stack">
    <span class="text-body-strong truncate">{{ blueprint.name }}</span>
    <span class="text-xs text-subtle truncate">
      {{ courseLabel(blueprint) }} · {{ questionCount(blueprint) }} soru
    </span>
  </div>
</ng-template>

<ng-template #scopeCell let-blueprint>
  <app-status-badge
    [label]="scopeLabel(blueprint)"
    [tone]="blueprint.cohortId ? 'info' : 'neutral'"
    [icon]="blueprint.cohortId ? 'users' : 'book-open'"
  />
</ng-template>

<ng-template #stateCell let-blueprint>
  <app-status-badge
    [label]="toneFor(blueprint.state).label"
    [tone]="toneFor(blueprint.state).tone"
    [icon]="toneFor(blueprint.state).icon"
  />
</ng-template>

<ng-template #actionsCell let-blueprint>
  <app-dropdown
    [items]="rowActions(blueprint)"
    triggerLabel="Plan işlemleri"
    (itemSelect)="onRowAction(blueprint, $event)"
  />
</ng-template>
