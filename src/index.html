<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Adaptif Eğitim · Sınav ve Öğrenme Analitiği</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kazanım tabanlı adaptif öğrenme, sınav yönetimi ve öğrenme analitiği platformu."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Tema damgası, Angular önyüklenmeden ÖNCE basılır.

      Aksi hâlde sayfa önce açık temada boyanıp uygulama açıldığında koyuya
      dönüyor ve gözle görülür bir beyaz parlama oluyordu. Depodaki tercih
      `ThemeStore` ile aynı anahtardan okunur; seçim yoksa işletim sistemi
      ayarına düşülür.
    -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('adaptif.theme'));
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          /* Depolama kapalıysa açık tema ile devam edilir. */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <!-- Uygulama önyüklenene kadar görünen sade açılış göstergesi -->
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: system-ui, sans-serif;
          color: #6b7280;
          font-size: 14px;
        "
      >
        Yükleniyor…
      </div>
    </app-root>
  </body>
</html>
